services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ham
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ham']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itsm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ham
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itsm-network

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ham
    volumes:
      - ./backups:/backups
    networks:
      - itsm-network

  prometheus:
    image: prom/prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - itsm-network

  grafana:
    image: grafana/grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - itsm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - itsm-network

volumes:
  postgres-data:

networks:
  itsm-network:
    driver: bridge
